<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CafeGO — Kitchen Queue (KDS)</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .stat-pills-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 12px 14px 4px; flex-shrink: 0; }
    .kds-pill { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 4px; text-align: center; cursor: pointer; }
    .kds-pill.active { border-color: var(--brand); background: rgba(90,56,37,0.1); }
    .kds-count { font-family: var(--font-serif); font-size: 16px; font-weight: 800; color: var(--ink); }
    .kds-lbl { font-size: 10px; font-weight: 600; color: var(--mute); }
    .timer-pill { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 800; color: #D6336C; background: rgba(214,51,108,0.12); border: 1px solid rgba(214,51,108,0.25); padding: 2px 7px; border-radius: 99px; }
    .kds-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
    .amber-note-box { margin-top: 8px; background: rgba(217,119,6,0.12); border: 1px solid rgba(217,119,6,0.35); color: var(--ink); border-radius: 10px; padding: 8px 10px; font-size: 12px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="phone-screen" id="phoneScreen">
      <div class="status-bar">
        <span>9:41</span><div class="dynamic-island"></div><div class="status-icons"><span>5G</span><span>■■</span></div>
      </div>

      <header class="admin-top-bar">
        <div class="app-logo">
          <div class="app-logo-emblem sm"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h1a4 4 0 0 1 0 8h-1v1a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V8h16zm0 6h1a2 2 0 0 0 0-4h-1v4z"/></svg></div>
          <div class="app-logo-wordmark" style="font-size:16px;">Cafe<span class="go">GO</span></div>
        </div>
        <span class="admin-badge">🔥 KITCHEN QUEUE (KDS)</span>
        <div style="flex:1;"></div>
        <button type="button" class="icon-btn-sm" onclick="toggleAppTheme()">◐</button>
        <a href="login.html" class="icon-btn-sm">⎋</a>
      </header>

      <div class="stat-pills-grid">
        <div class="kds-pill" onclick="setFilter('received', this)"><div class="kds-count" id="cRec">0</div><div class="kds-lbl">Received</div></div>
        <div class="kds-pill" onclick="setFilter('preparing', this)"><div class="kds-count" id="cPrep">0</div><div class="kds-lbl">Preparing</div></div>
        <div class="kds-pill" onclick="setFilter('ready', this)"><div class="kds-count" id="cReady">0</div><div class="kds-lbl">Ready</div></div>
        <div class="kds-pill active" onclick="setFilter('all', this)"><div class="kds-count" id="cAll">0</div><div class="kds-lbl">All Queue</div></div>
      </div>

      <main class="screen-scroll page-pad" id="kdsFeed"></main>

      <div class="home-bar-wrap"><div class="home-bar"></div></div>
    </div>
  </div>

  <script src="demo-store.js"></script>
  <script src="shared.js"></script>
  <script>
    let kdsFilter = 'all';

    function setFilter(f, el) {
      kdsFilter = f;
      document.querySelectorAll('.kds-pill').forEach(p => p.classList.remove('active'));
      if (el) el.classList.add('active');
      renderKds(CafeDemo.getState());
    }

    function advanceTicket(id, next) {
      CafeDemo.setState(s => {
        const ord = s.orders.find(o => o.id === id);
        if (!ord) return s;
        ord.status = next;
        if (next === 'ready') {
          ord.items.forEach(it => {
            const m = s.menu.find(x => x.id === it.itemId);
            if (m && m.stock > 0) m.stock = Math.max(0, m.stock - it.qty);
          });
        }
        if (next === 'completed') {
          ord.paymentStatus = 'paid';
          ord.riderProgress = 1.0;
          s.user.loyaltyStamps = Math.min(8, (s.user.loyaltyStamps || 0) + 1);
        }
        return s;
      });
    }

    function openCashier(id) {
      CafeDemo.setState(s => { s.cashierOrderId = id; return s; });
      window.location.href = 'staff-cashier.html';
    }

    function formatElapsed(ms) {
      const sec = Math.max(1, Math.floor((Date.now() - ms) / 1000));
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function renderKds(state) {
      const queue = (state.orders || []).filter(o => o.status !== 'completed' && o.status !== 'cancelled');
      const recCount = queue.filter(o => o.status === 'received').length;
      const prepCount = queue.filter(o => o.status === 'preparing').length;
      const readyCount = queue.filter(o => o.status === 'ready').length;

      document.getElementById('cRec').textContent = recCount;
      document.getElementById('cPrep').textContent = prepCount;
      document.getElementById('cReady').textContent = readyCount;
      document.getElementById('cAll').textContent = queue.length;

      const shown = kdsFilter === 'all' ? queue : queue.filter(o => o.status === kdsFilter);
      const feed = document.getElementById('kdsFeed');
      if (!shown.length) {
        feed.innerHTML = `<div style="text-align:center; padding:48px 16px;" class="muted-text">No active tickets in ${kdsFilter}.</div>`;
        return;
      }

      feed.innerHTML = shown.map(o => {
        const nextStatus = o.status === 'received' ? 'preparing' : o.status === 'preparing' ? 'ready' : 'completed';
        const ctaText = o.status === 'received' ? 'Start Preparing' : o.status === 'preparing' ? 'Mark as Ready' : 'Mark as Handed Off';
        const typeLbl = o.type === 'delivery' ? 'Delivery' : (o.type === 'dineIn' ? 'Dine-in' : 'Pickup');
        return `
          <div class="kds-card">
            <div class="row-between" style="gap:8px;">
              <strong style="font-family:var(--font-serif); font-size:17px;">${o.userName}</strong>
              <div style="display:flex; align-items:center; gap:6px;">
                <span class="timer-pill" data-created="${o.createdAt}">⏱ ${formatElapsed(o.createdAt)}</span>
                <span class="status-badge">${CafeDemo.statusLabel(o.status)}</span>
              </div>
            </div>
            <div class="muted-text" style="margin-top:4px; font-size:12px;">
              ${o.items.length} item(s) • ${typeLbl} • ${o.payment} (${o.paymentStatus.toUpperCase()}) • ${CafeDemo.peso(o.total)}
            </div>
            <div class="divider"></div>
            ${o.items.map(it => `<div style="font-size:13px; font-weight:600; margin-bottom:3px;">${it.qty}x ${it.name} ${it.summary ? `<span class="muted-text">(${it.summary})</span>` : ''}</div>`).join('')}
            ${o.note ? `<div class="amber-note-box">Special Instruction: ${o.note}</div>` : ''}
            <div style="display:flex; gap:8px; margin-top:12px;">
              <button type="button" class="brand-btn" style="flex:1; height:44px; font-size:13.5px;" onclick="advanceTicket('${o.id}', '${nextStatus}')">${ctaText}</button>
              ${o.paymentStatus === 'pending' ? `<button type="button" class="ghost-btn" style="padding:0 12px; font-size:12px;" onclick="openCashier('${o.id}')">Receive Cash</button>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    CafeDemo.onUpdate(renderKds);
    setInterval(() => {
      document.querySelectorAll('.timer-pill[data-created]').forEach(el => {
        el.textContent = '⏱ ' + formatElapsed(Number(el.dataset.created));
      });
    }, 1000);
  </script>
</body>
</html>
