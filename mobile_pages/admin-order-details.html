<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CafeGO — Order Details</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .modal-dim { flex: 1; background: rgba(27,18,12,0.55); display: flex; flex-direction: column; justify-content: flex-end; }
    .details-sheet { height: 88%; background: var(--card); border-radius: 24px 24px 0 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
    .banner-box { padding: 12px; border-radius: 14px; background: rgba(90,56,37,0.08); border: 1px solid rgba(90,56,37,0.25); display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .driver-box { padding: 12px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .driver-picker-modal { position: absolute; inset: 0; background: rgba(0,0,0,0.55); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 40; }
    .driver-picker-modal.open { display: flex; }
    .dialog-card { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="phone-screen" id="phoneScreen">
      <div class="status-bar light-text" style="background:rgba(27,18,12,0.55);">
        <span>9:41</span><div class="dynamic-island"></div><div class="status-icons"><span>5G</span><span>■■</span></div>
      </div>

      <div class="modal-dim">
        <div class="details-sheet">
          <div style="width:44px; height:4.5px; border-radius:99px; background:var(--line); margin:12px auto;"></div>
          <div class="row-between" style="padding:0 18px;">
            <div>
              <h1 id="mdCust" style="font-family:var(--font-serif); font-size:21px; font-weight:800;">Customer</h1>
              <div id="mdDate" class="muted-text" style="font-size:12px;">Today</div>
            </div>
            <div style="display:flex; align-items:center; gap:6px;">
              <span id="mdBadge" class="status-badge">Received</span>
              <a href="admin-orders.html" class="icon-btn-sm">✕</a>
            </div>
          </div>

          <div class="divider"></div>

          <div class="screen-scroll" style="padding:0 18px 14px;">
            <div class="banner-box">
              <span id="mdTypeIcon" style="font-size:20px;">🛵</span>
              <div>
                <div id="mdTypeTitle" style="font-size:13.5px; font-weight:700;">Delivery Order</div>
                <div id="mdAddr" class="muted-text" style="font-size:12px;">BGC, Taguig</div>
              </div>
            </div>

            <div id="driverSyncBox" class="driver-box">
              <div style="width:36px; height:36px; border-radius:50%; background:rgba(212,163,115,0.2); display:flex; align-items:center; justify-content:center; flex-shrink:0;">🛵</div>
              <div style="flex:1;">
                <div id="assignedDriverLbl" style="font-size:13px; font-weight:700;">No Driver Assigned</div>
                <div id="assignedDriverSub" class="muted-text" style="font-size:11.5px;">Waiting for assignment</div>
              </div>
              <button type="button" id="assignBtn" onclick="document.getElementById('driverModal').classList.add('open')" style="background:none; border:none; color:var(--brand); font-weight:700; font-size:12.5px; cursor:pointer;">Assign</button>
            </div>

            <h2 id="mdItemsTitle" style="font-family:var(--font-serif); font-size:16px; font-weight:700; margin-bottom:8px;">Items Ordered</h2>
            <div id="mdItemsList"></div>

            <div class="card-box" style="background:var(--bg); margin-top:12px;">
              <div class="row-between muted-text" style="margin-bottom:4px;"><span>Subtotal</span><span id="mdSub" style="color:var(--ink); font-weight:600;">₱ 0.00</span></div>
              <div class="row-between muted-text" style="margin-bottom:6px;"><span>Delivery Fee</span><span id="mdDel" style="color:var(--ink); font-weight:600;">₱ 0.00</span></div>
              <div class="divider"></div>
              <div class="row-between" style="margin-bottom:8px;">
                <strong style="font-size:15.5px;">Total Amount</strong>
                <strong id="mdTotal" style="font-size:16px; color:var(--brand);">₱ 0.00</strong>
              </div>
              <div class="row-between">
                <span id="mdPayLbl" class="muted-text" style="font-size:12px;">Payment</span>
                <span id="mdPayBadge" class="status-badge paid">PAID</span>
              </div>
            </div>
          </div>

          <div style="padding:12px 18px 8px; border-top:1px solid var(--line); background:var(--card);" id="mdFooter"></div>
        </div>
      </div>

      <div class="driver-picker-modal" id="driverModal">
        <div class="dialog-card">
          <h3 style="font-family:var(--font-serif); font-size:17px; font-weight:700; margin-bottom:10px;">Assign Driver</h3>
          <div id="driversChoiceList"></div>
          <div style="display:flex; justify-content:flex-end; margin-top:10px;">
            <button type="button" onclick="document.getElementById('driverModal').classList.remove('open')" class="ghost-btn">Cancel</button>
          </div>
        </div>
      </div>

      <div class="home-bar-wrap" style="background:var(--card);"><div class="home-bar"></div></div>
    </div>
  </div>

  <script src="demo-store.js"></script>
  <script src="shared.js"></script>
  <script>
    let modalOrder = null;

    function selectDriver(uid, name) {
      if (!modalOrder) return;
      CafeDemo.setState(s => {
        const o = s.orders.find(x => x.id === modalOrder.id);
        if (o) {
          o.driverId = uid;
          o.driverName = name;
          o.driverStatus = 'assigned';
          s.driver.activeOrderId = o.id;
        }
        return s;
      });
      document.getElementById('driverModal').classList.remove('open');
    }

    function advanceModalOrder(next) {
      if (!modalOrder) return;
      CafeDemo.setState(s => {
        const o = s.orders.find(x => x.id === modalOrder.id);
        if (o) {
          o.status = next;
          if (next === 'completed') { o.paymentStatus = 'paid'; o.riderProgress = 1.0; }
        }
        return s;
      });
    }

    function bumpModalGps() {
      if (!modalOrder) return;
      CafeDemo.setState(s => {
        const o = s.orders.find(x => x.id === modalOrder.id);
        if (o) o.riderProgress = Math.min(0.95, Number(((o.riderProgress || 0.2) + 0.25).toFixed(2)));
        return s;
      });
    }

    function cancelModalOrder() {
      if (!modalOrder) return;
      CafeDemo.setState(s => {
        const o = s.orders.find(x => x.id === modalOrder.id);
        if (o) o.status = 'cancelled';
        return s;
      });
      window.location.href = 'admin-orders.html';
    }

    CafeDemo.onUpdate(state => {
      const o = state.orders.find(x => x.id === state.selectedAdminOrderId) || state.orders[0];
      if (!o) return;
      modalOrder = o;

      document.getElementById('mdCust').textContent = o.userName;
      document.getElementById('mdDate').textContent = '#' + o.id + ' • ' + new Date(o.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const b = document.getElementById('mdBadge');
      b.textContent = CafeDemo.statusLabel(o.status);
      b.className = 'status-badge' + (o.status === 'cancelled' ? ' cancelled' : '');

      document.getElementById('mdTypeIcon').textContent = o.type === 'delivery' ? '🛵' : o.type === 'dineIn' ? '🪑' : '🏪';
      document.getElementById('mdTypeTitle').textContent = o.type === 'delivery' ? 'Delivery Order' : o.type === 'dineIn' ? 'Dine-In' : 'Pick-Up Order';
      document.getElementById('mdAddr').textContent = o.address || o.branchName;

      document.getElementById('driverSyncBox').style.display = o.type === 'delivery' ? 'flex' : 'none';
      document.getElementById('assignedDriverLbl').textContent = o.driverName ? 'Driver: ' + o.driverName : 'No Driver Assigned';
      document.getElementById('assignedDriverSub').textContent = o.driverStatus ? 'Status: ' + o.driverStatus.toUpperCase() : 'Waiting for driver assignment';
      document.getElementById('assignBtn').textContent = o.driverId ? 'Reassign' : 'Assign';

      const drivers = (state.usersDirectory || []).filter(u => u.role === 'driver');
      document.getElementById('driversChoiceList').innerHTML = drivers.map(d => `
        <div class="card-box" style="margin-bottom:8px; cursor:pointer;" onclick="selectDriver('${d.uid}', '${d.name}')">
          <div class="row-between">
            <div><strong style="font-size:13.5px;">🛵 ${d.name}</strong><div class="muted-text" style="font-size:11.5px;">${d.phone}</div></div>
            ${o.driverId === d.uid ? '<span style="color:var(--ok); font-weight:800;">✓</span>' : ''}
          </div>
        </div>
      `).join('');

      document.getElementById('mdItemsTitle').textContent = `Items Ordered (${o.items.length})`;
      document.getElementById('mdItemsList').innerHTML = o.items.map(it => `
        <div class="card-box" style="margin-bottom:8px; padding:11px 12px;">
          <div class="row-between"><strong style="font-size:13.5px;">${it.qty}x ${it.name}</strong><strong style="font-size:13.5px; color:var(--brand);">${CafeDemo.peso(it.total)}</strong></div>
          ${it.summary ? `<div class="muted-text" style="font-size:12px; margin-top:2px;">${it.summary}</div>` : ''}
          ${it.note ? `<div style="font-size:11.5px; font-weight:600; color:var(--crema); margin-top:2px;">Note: ${it.note}</div>` : ''}
        </div>
      `).join('');

      document.getElementById('mdSub').textContent = CafeDemo.peso(o.subtotal);
      document.getElementById('mdDel').textContent = CafeDemo.peso(o.deliveryFee);
      document.getElementById('mdTotal').textContent = CafeDemo.peso(o.total);
      document.getElementById('mdPayLbl').textContent = 'Payment: ' + o.payment;
      const pb = document.getElementById('mdPayBadge');
      pb.className = 'status-badge ' + (o.paymentStatus === 'paid' ? 'paid' : 'pending');
      pb.textContent = o.paymentStatus.toUpperCase();

      const nextSt = o.status === 'received' ? 'preparing' : o.status === 'preparing' ? 'ready' : o.status === 'ready' ? 'completed' : null;
      document.getElementById('mdFooter').innerHTML = `
        ${nextSt ? `<button type="button" class="brand-btn" style="height:46px; font-size:14px; margin-bottom:8px;" onclick="advanceModalOrder('${nextSt}')">Advance to ${CafeDemo.statusLabel(nextSt)}</button>` : ''}
        <div style="display:flex; gap:8px;">
          ${(o.type === 'delivery' && o.status === 'ready') ? `<button type="button" class="ghost-btn" style="flex:1;" onclick="bumpModalGps()">🛵 Advance GPS</button>` : ''}
          ${(o.status === 'received' || o.status === 'preparing') ? `<button type="button" class="ghost-btn" style="flex:1;" onclick="cancelModalOrder()">Cancel Order</button>` : ''}
        </div>
      `;
    });
  </script>
</body>
</html>
