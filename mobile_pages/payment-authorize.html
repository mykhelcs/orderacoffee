<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CafeGO — Complete Payment</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .sheet-overlay { flex: 1; background: rgba(27,18,12,0.52); display: flex; flex-direction: column; justify-content: flex-end; }
    .pay-sheet { background: var(--card); border-radius: 26px 26px 0 0; padding: 14px 20px 24px; border-top: 1px solid var(--line); }
    .handle-pill { width: 42px; height: 4px; border-radius: 99px; background: var(--line); margin: 0 auto 14px; }
    .meta-box { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 14px 0 18px; font-size: 13px; }
    .meta-row { display: flex; justify-content: space-between; margin-bottom: 8px; gap: 12px; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="phone-screen" id="phoneScreen">
      <div class="status-bar light-text" style="background:rgba(27,18,12,0.52);">
        <span>9:41</span><div class="dynamic-island"></div><div class="status-icons"><span>5G</span><span>■■</span></div>
      </div>

      <div class="sheet-overlay">
        <div class="pay-sheet">
          <div class="handle-pill"></div>
          <h1 style="font-family:var(--font-serif); font-size:21px; font-weight:700;">Complete Payment</h1>
          <p class="muted-text" style="margin-top:4px;">Authorize your PayMongo digital checkout session.</p>

          <div class="meta-box">
            <div class="meta-row"><span style="color:var(--mute);">Method</span><strong id="pmMethod">GCash</strong></div>
            <div class="meta-row"><span style="color:var(--mute);">Amount Due</span><strong id="pmAmount" style="color:var(--brand); font-size:15px;">₱ 310.00</strong></div>
            <div class="meta-row"><span style="color:var(--mute);">Session ID</span><code id="pmSession" style="font-size:11.5px;">cs_test_9f4b21a8c</code></div>
            <div class="meta-row" style="margin-bottom:0;"><span style="color:var(--mute);">Checkout URL</span><span style="color:var(--brand); font-size:11.5px; text-decoration:underline;">checkout.paymongo.com/...</span></div>
          </div>

          <button type="button" class="brand-btn" style="margin-bottom:10px;" onclick="authorizeNow()">Authorize Payment Now</button>
          <a href="order-tracking.html" class="ghost-btn" style="width:100%;">Await Webhook / Track Order (Pending)</a>
        </div>
      </div>

      <div class="home-bar-wrap" style="background:var(--card);"><div class="home-bar"></div></div>
    </div>
  </div>
  <script src="demo-store.js"></script>
  <script src="shared.js"></script>
  <script>
    let targetId = null;
    function authorizeNow() {
      CafeDemo.setState(s => {
        const ord = s.orders.find(o => o.id === targetId);
        if (ord) ord.paymentStatus = 'paid';
        return s;
      });
      window.location.href = 'order-tracking.html';
    }

    CafeDemo.onUpdate(state => {
      const id = state.pendingPayOrderId || state.activeOrderId;
      const ord = state.orders.find(o => o.id === id) || state.orders[0];
      if (!ord) return;
      targetId = ord.id;
      document.getElementById('pmMethod').textContent = ord.payment;
      document.getElementById('pmAmount').textContent = CafeDemo.peso(ord.total);
      document.getElementById('pmSession').textContent = 'cs_test_' + ord.id.toLowerCase();
    });
  </script>
</body>
</html>
