<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CafeGO — Menu</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .item-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; }
    .item-title { font-family: var(--font-serif); font-size: 16px; font-weight: 700; color: var(--ink); line-height: 1.2; }
    .item-desc { font-size: 12px; color: var(--mute); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 3px; }
    .item-right { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; flex-shrink: 0; }
    .item-price { font-size: 14px; font-weight: 800; color: var(--ink); }
    .cat-mini-pill { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: var(--surface-tint); color: var(--brand); }
    .sold-out-tag { font-size: 10px; font-weight: 800; color: #D6336C; background: rgba(214,51,108,0.12); padding: 3px 7px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="phone-screen" id="phoneScreen">
      <div class="status-bar">
        <span>9:41</span>
        <div class="dynamic-island"></div>
        <div class="status-icons"><span>5G</span><span>■■</span></div>
      </div>

      <header class="main-top-bar">
        <a href="menu.html" class="app-logo">
          <div class="app-logo-emblem sm">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18 8h1a4 4 0 0 1 0 8h-1v1a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V8h16zm0 6h1a2 2 0 0 0 0-4h-1v4z"/>
            </svg>
          </div>
          <div class="app-logo-wordmark" style="font-size:18px;">Cafe<span class="go">GO</span></div>
        </a>

        <button type="button" class="theme-pill-btn" onclick="toggleAppTheme()">
          <span id="themeToggleIcon">🌙</span>
          <span id="themeToggleLabel">Espresso</span>
        </button>
      </header>

      <main class="screen-scroll page-pad" style="padding-top:14px;">
        <div id="pausedNotice" style="display:none; background:rgba(214,51,108,0.12); border:1px solid rgba(214,51,108,0.35); color:#D6336C; border-radius:12px; padding:10px 12px; font-size:12.5px; font-weight:700; margin-bottom:12px;">
          Store is temporarily paused by management. Browsing only.
        </div>

        <div class="hero-banner">
          <div style="flex:1; min-width:0;">
            <span class="hero-pill">DAILY SPECIAL</span>
            <div style="font-size:11.5px; color:#E5A862; font-weight:700;">CafeGO Comfort Club</div>
            <div style="font-family:var(--font-serif); font-size:19px; font-weight:800; line-height:1.15; margin:2px 0 4px;">
              Your daily comfort brew.
            </div>
            <div style="font-size:11.5px; color:rgba(255,255,255,0.82); line-height:1.35;">
              Order ahead. Freshly handcrafted when you arrive.
            </div>
          </div>
          <img src="../assets/images/coffee_splash.jpg" alt="Daily Special" class="hero-thumb" />
        </div>

        <div class="search-pill">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <input id="menuSearch" type="text" placeholder="Search handcrafted coffee & fresh bakery..." oninput="renderMenu(CafeDemo.getState())" style="border:none; background:transparent; outline:none; flex:1; color:var(--ink); font-family:var(--font-sans); font-size:13px;" />
        </div>

        <div class="chips-row" id="catChips">
          <button type="button" class="cat-chip active" onclick="selectCat('All', this)">All</button>
          <button type="button" class="cat-chip" onclick="selectCat('Favorites', this)">❤️ Favorites</button>
          <button type="button" class="cat-chip" onclick="selectCat('Hot Coffee', this)">Hot Coffee</button>
          <button type="button" class="cat-chip" onclick="selectCat('Iced Coffee', this)">Iced Coffee</button>
          <button type="button" class="cat-chip" onclick="selectCat('Non-Coffee', this)">Non-Coffee</button>
          <button type="button" class="cat-chip" onclick="selectCat('Pastries', this)">Pastries</button>
          <button type="button" class="cat-chip" onclick="selectCat('Merch', this)">Merch</button>
        </div>

        <div class="row-between" style="margin-top:16px;">
          <h2 class="section-title">Barista Picks</h2>
          <span class="muted-text" style="font-size:11.5px;">Handcrafted Favorites</span>
        </div>

        <div class="picks-row" id="picksRow"></div>

        <div class="row-between" style="margin:18px 0 10px;">
          <h2 class="section-title">Full Menu</h2>
          <span class="muted-text" id="itemCountLabel" style="font-size:12px;">0 items</span>
        </div>

        <div id="menuList"></div>
      </main>

      <nav class="main-bottom-nav">
        <a href="menu.html" class="nav-item active">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/></svg>
          <span>Menu</span>
        </a>
        <a href="cart.html" class="nav-item">
          <div class="nav-icon-wrap">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            <span class="nav-badge" data-cart-badge>0</span>
          </div>
          <span>Cart</span>
        </a>
        <a href="orders.html" class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M8 7h8"/><path d="M8 11h8"/><path d="M8 15h5"/></svg>
          <span>Orders</span>
        </a>
        <a href="profile.html" class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
          <span>Profile</span>
        </a>
      </nav>

      <div class="home-bar-wrap" style="background:var(--card);"><div class="home-bar"></div></div>
    </div>
  </div>

  <script src="demo-store.js"></script>
  <script src="shared.js"></script>
  <script>
    let activeCat = 'All';

    function selectCat(cat, btn) {
      activeCat = cat;
      document.querySelectorAll('#catChips .cat-chip').forEach(c => c.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderMenu(CafeDemo.getState());
    }

    function openItem(id) {
      CafeDemo.setState(s => { s.selectedItemId = id; s.editCartLineId = null; return s; });
      window.location.href = 'item-detail.html';
    }

    function toggleFavItem(e, id) {
      e.stopPropagation();
      CafeDemo.setState(s => {
        const idx = s.user.favorites.indexOf(id);
        if (idx >= 0) s.user.favorites.splice(idx, 1);
        else s.user.favorites.push(id);
        return s;
      });
    }

    function renderMenu(state) {
      CafeDemo.updateNavBadges(state);
      document.getElementById('pausedNotice').style.display = state.storeOpen ? 'none' : 'block';

      const visible = (state.menu || []).filter(i => !i.isHidden);
      const favs = state.user.favorites || [];

      const picksRow = document.getElementById('picksRow');
      picksRow.innerHTML = visible.slice(0, 4).map(item => {
        const isFav = favs.includes(item.id);
        return `
          <div class="pick-card" style="cursor:pointer;" onclick="openItem('${item.id}')">
            <div class="row-between">
              <span class="cat-mini-pill">${item.category}</span>
              <span onclick="toggleFavItem(event, '${item.id}')" style="color:${isFav ? '#D6336C' : 'var(--mute)'}; font-size:15px;">${isFav ? '♥' : '♡'}</span>
            </div>
            <img src="${item.imageUrl || '../assets/images/coffee_splash.jpg'}" onerror="this.src='../assets/images/coffee_splash.jpg'" alt="${item.name}" class="pick-img" />
            <div style="font-family:var(--font-serif); font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.name}</div>
            <div style="font-size:12.5px; font-weight:800; color:var(--brand); margin-top:2px;">${CafeDemo.peso(item.basePrice)}</div>
          </div>
        `;
      }).join('');

      const q = (document.getElementById('menuSearch').value || '').trim().toLowerCase();
      const filtered = visible.filter(item => {
        const catOk = activeCat === 'All' || (activeCat === 'Favorites' ? favs.includes(item.id) : item.category === activeCat);
        const searchOk = !q || item.name.toLowerCase().includes(q) || item.description.toLowerCase().includes(q);
        return catOk && searchOk;
      });

      document.getElementById('itemCountLabel').textContent = filtered.length + (filtered.length === 1 ? ' item' : ' items');

      document.getElementById('menuList').innerHTML = filtered.map(item => `
        <div class="item-card" style="cursor:${item.isAvailable ? 'pointer' : 'default'}; opacity:${item.isAvailable ? '1' : '0.6'};" onclick="${item.isAvailable ? `openItem('${item.id}')` : ''}">
          <img src="${item.imageUrl || '../assets/images/coffee_splash.jpg'}" onerror="this.src='../assets/images/coffee_splash.jpg'" alt="${item.name}" class="item-thumb" />
          <div class="item-meta">
            <div>
              <div class="item-title">${item.name}</div>
              <div class="item-desc">${item.description}</div>
            </div>
          </div>
          <div class="item-right">
            <span class="item-price">${CafeDemo.peso(item.basePrice)}</span>
            ${item.isAvailable ? '<span class="item-plus-btn">+</span>' : '<span class="sold-out-tag">Sold Out</span>'}
          </div>
        </div>
      `).join('');
    }

    CafeDemo.onUpdate(renderMenu);
  </script>
</body>
</html>
