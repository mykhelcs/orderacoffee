<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CafeGO — HyperFrame Cursor Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Figtree', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 50% 25%, #231b18 0%, #111011 55%, #090809 100%);
      color: #F7F2EE;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 18px 86px;
      overflow-x: hidden;
    }

    /* Minimal Top Bar */
    .demo-topbar {
      width: 100%;
      max-width: 920px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
    }

    .brand-mark {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 800;
      color: #F7F2EE;
      letter-spacing: -0.3px;
    }
    .brand-mark span { color: #D4A373; }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-pill-btn {
      background: rgba(35, 31, 32, 0.88);
      border: 1px solid #3F3536;
      color: #F7F2EE;
      font-family: 'Figtree', sans-serif;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 99px;
      cursor: pointer;
      text-decoration: none;
    }
    .top-pill-btn:hover { border-color: #D4A373; color: #D4A373; }

    /* Two-Phone HyperFrame Stage */
    .stage-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
      width: 100%;
      margin-top: 2px;
    }

    .device-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
    }

    .device-col.spotlight {
      transform: scale(1.028);
      opacity: 1;
    }

    .device-col.dimmed {
      transform: scale(0.975);
      opacity: 0.78;
    }

    .role-strip {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(28, 25, 26, 0.9);
      border: 1px solid #332B2D;
      padding: 4px;
      border-radius: 99px;
    }

    .role-tab {
      background: transparent;
      border: none;
      color: #A69A93;
      font-family: 'Figtree', sans-serif;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .role-tab:hover { color: #F7F2EE; }
    .role-tab.active {
      background: #D4A373;
      color: #231F20;
    }

    .device-bezel {
      width: 368px;
      height: 760px;
      background: #0a090a;
      border-radius: 48px;
      padding: 10px;
      box-shadow: 0 0 0 2px #322B2D, 0 28px 64px rgba(0, 0, 0, 0.75);
      transition: box-shadow 0.4s ease;
    }

    .device-col.spotlight .device-bezel {
      box-shadow: 0 0 0 2px #D4A373, 0 32px 72px rgba(212, 163, 115, 0.22);
    }

    .device-viewport {
      width: 100%;
      height: 100%;
      border-radius: 38px;
      overflow: hidden;
      background: #1A1513;
    }

    .device-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Minimal Floating HyperFrame Bar */
    .hyper-dock {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2500;
      width: calc(100% - 28px);
      max-width: 720px;
      background: rgba(20, 18, 19, 0.92);
      backdrop-filter: blur(18px);
      border: 1px solid #362E30;
      border-radius: 99px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65);
    }

    .play-pill {
      background: #D4A373;
      color: #231F20;
      border: none;
      border-radius: 99px;
      padding: 7px 14px;
      font-family: 'Figtree', sans-serif;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .scene-pill {
      background: #2B2425;
      border: 1px solid #413638;
      color: #E5A862;
      border-radius: 99px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .scrubber {
      flex: 1;
      height: 5px;
      -webkit-appearance: none;
      background: #362E30;
      border-radius: 99px;
      outline: none;
      cursor: pointer;
      min-width: 80px;
    }
    .scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #D4A373;
      box-shadow: 0 0 8px rgba(212, 163, 115, 0.8);
      cursor: pointer;
    }

    .time-readout {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #A69A93;
      white-space: nowrap;
    }

    .spd-btn {
      background: #231F20;
      border: 1px solid #3B3234;
      color: #A69A93;
      border-radius: 99px;
      padding: 4px 8px;
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .spd-btn.active {
      background: #3F3536;
      color: #F7F2EE;
      border-color: #D4A373;
    }

    /* Animated Demo Pointer Cursor & Tap Ripple */
    .demo-cursor {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 3000;
      pointer-events: none;
      transform: translate(-4px, -2px);
      transition: left 0.56s cubic-bezier(0.22, 1, 0.36, 1), top 0.56s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease, transform 0.14s ease;
      filter: drop-shadow(0 5px 12px rgba(0, 0, 0, 0.55));
      opacity: 0;
    }
    .demo-cursor.visible { opacity: 1; }
    .demo-cursor.clicking { transform: translate(-4px, -2px) scale(0.82); }

    .tap-ripple {
      position: fixed;
      z-index: 2999;
      pointer-events: none;
      width: 36px;
      height: 36px;
      margin-left: -18px;
      margin-top: -18px;
      border-radius: 50%;
      border: 2.5px solid #D4A373;
      background: rgba(212, 163, 115, 0.28);
      opacity: 0;
    }
    .tap-ripple.animate {
      animation: tapPop 0.52s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes tapPop {
      0% { transform: scale(0.35); opacity: 0.95; }
      100% { transform: scale(1.65); opacity: 0; }
    }

    @media (max-height: 900px) and (min-width: 820px) {
      .device-bezel {
        width: 344px;
        height: 696px;
      }
    }
  </style>
</head>
<body>
  <header class="demo-topbar">
    <div class="brand-mark">Cafe<span>GO</span></div>
    <div class="top-actions">
      <a href="mobile_pages/index.html" class="top-pill-btn">All Screens</a>
      <button type="button" class="top-pill-btn" onclick="resetAndPause()">↻ Reset</button>
    </div>
  </header>

  <main class="stage-grid">
    <!-- Left Phone: Users App -->
    <section class="device-col" id="userCol">
      <div class="role-strip" id="userNavStrip">
        <button type="button" class="role-tab" onclick="manualNavUser('mobile_pages/landing.html', 0)">Splash</button>
        <button type="button" class="role-tab" onclick="manualNavUser('mobile_pages/login.html', 1)">Login</button>
        <button type="button" class="role-tab active" onclick="manualNavUser('mobile_pages/menu.html', 2)">Menu</button>
        <button type="button" class="role-tab" onclick="manualNavUser('mobile_pages/cart.html', 3)">Cart</button>
        <button type="button" class="role-tab" onclick="manualNavUser('mobile_pages/order-tracking.html', 4)">Track</button>
        <button type="button" class="role-tab" onclick="manualNavUser('mobile_pages/profile.html', 5)">Profile</button>
      </div>
      <div class="device-bezel">
        <div class="device-viewport">
          <iframe id="userPhoneFrame" class="device-iframe" src="mobile_pages/landing.html" title="User App"></iframe>
        </div>
      </div>
    </section>

    <!-- Right Phone: Admin Manager & Staffs -->
    <section class="device-col" id="opsCol">
      <div class="role-strip" id="opsNavStrip">
        <button type="button" class="role-tab active" onclick="manualNavOps('mobile_pages/staff-kds.html', 0)">Kitchen Staff</button>
        <button type="button" class="role-tab" onclick="manualNavOps('mobile_pages/driver-workspace.html', 1)">Driver Staff</button>
        <button type="button" class="role-tab" onclick="manualNavOps('mobile_pages/admin-orders.html', 2)">Admin Manager</button>
      </div>
      <div class="device-bezel">
        <div class="device-viewport">
          <iframe id="opsPhoneFrame" class="device-iframe" src="mobile_pages/staff-kds.html" title="Admin and Staffs App"></iframe>
        </div>
      </div>
    </section>
  </main>

  <!-- Minimal HyperFrame Transport Bar -->
  <div class="hyper-dock">
    <button type="button" class="play-pill" id="playBtn" onclick="togglePlay()">⏸ Pause</button>
    <span class="scene-pill" id="sceneChip">1 · Onboarding</span>
    <input type="range" class="scrubber" id="timeScrubber" min="0" max="48" step="0.1" value="0" oninput="onScrub(this.value)" />
    <span class="time-readout" id="timeReadout">00:00 / 00:48</span>
    <button type="button" class="spd-btn active" onclick="setSpeed(1, this)">1x</button>
    <button type="button" class="spd-btn" onclick="setSpeed(1.5, this)">1.5x</button>
    <button type="button" class="spd-btn" onclick="setSpeed(2, this)">2x</button>
  </div>

  <!-- Crisp Animated Pointer Cursor + Ripple -->
  <div class="demo-cursor" id="demoCursor">
    <svg width="26" height="26" viewBox="0 0 28 28" fill="none">
      <path d="M5 3L23 13.5L14.8 15.8L11.5 23.5L5 3Z" fill="#1B120C" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="tap-ripple" id="tapRipple"></div>

  <script src="mobile_pages/demo-store.js"></script>
  <script>
    const userFrame = document.getElementById('userPhoneFrame');
    const opsFrame = document.getElementById('opsPhoneFrame');
    const userCol = document.getElementById('userCol');
    const opsCol = document.getElementById('opsCol');
    const cursorEl = document.getElementById('demoCursor');
    const rippleEl = document.getElementById('tapRipple');

    const TOTAL_DURATION = 48.0;
    let hostState = CafeDemo.getState();
    let currentTime = 0.0;
    let isPlaying = false;
    let playbackSpeed = 1.0;
    let lastTs = null;
    let rafId = null;
    let firedStepIds = new Set();
    let reqCounter = 1;
    const pendingRectQueries = new Map();

    // 1. Cross-frame State Sync Bridge
    function broadcastState(state, exceptSource) {
      [userFrame, opsFrame].forEach(f => {
        if (f && f.contentWindow && f.contentWindow !== exceptSource) {
          f.contentWindow.postMessage({ type: 'CAFEGO_STATE_SYNC', state }, '*');
        }
      });
    }

    window.addEventListener('message', (e) => {
      const data = e.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'CAFEGO_PULL_STATE') {
        if (e.source) e.source.postMessage({ type: 'CAFEGO_STATE_SYNC', state: hostState }, '*');
      } else if (data.type === 'CAFEGO_STATE_PUSH' && data.state) {
        hostState = data.state;
        try { localStorage.setItem('cafego_live_demo_state_v1', JSON.stringify(hostState)); } catch (_) {}
        broadcastState(hostState, e.source);
      } else if (data.type === 'CAFEGO_RECT_REPLY') {
        const resolver = pendingRectQueries.get(data.reqId);
        if (resolver) {
          pendingRectQueries.delete(data.reqId);
          resolver(data.rect);
        }
      }
    });

    userFrame.addEventListener('load', () => {
      userFrame.contentWindow.postMessage({ type: 'CAFEGO_STATE_SYNC', state: hostState }, '*');
    });
    opsFrame.addEventListener('load', () => {
      opsFrame.contentWindow.postMessage({ type: 'CAFEGO_STATE_SYNC', state: hostState }, '*');
    });

    // 2. Spotlight & Strip Tab Helpers
    function setFocus(side) {
      if (side === 'left') {
        userCol.className = 'device-col spotlight';
        opsCol.className = 'device-col dimmed';
      } else if (side === 'right') {
        userCol.className = 'device-col dimmed';
        opsCol.className = 'device-col spotlight';
      } else {
        userCol.className = 'device-col';
        opsCol.className = 'device-col';
      }
    }

    function setUserStrip(idx) {
      document.querySelectorAll('#userNavStrip .role-tab').forEach((b, i) => b.classList.toggle('active', i === idx));
    }
    function setOpsStrip(idx) {
      document.querySelectorAll('#opsNavStrip .role-tab').forEach((b, i) => b.classList.toggle('active', i === idx));
    }

    function manualNavUser(url, idx) {
      pauseVideo();
      setUserStrip(idx);
      userFrame.src = url;
    }
    function manualNavOps(url, idx) {
      pauseVideo();
      setOpsStrip(idx);
      opsFrame.src = url;
    }

    // 3. Sub-pixel Accurate Cursor Glide + Tap Ripple inside Iframes
    function queryElementRect(frame, selector, textMatch, index) {
      return new Promise(resolve => {
        if (!frame || !frame.contentWindow) return resolve(null);
        const id = reqCounter++;
        pendingRectQueries.set(id, resolve);
        frame.contentWindow.postMessage({ type: 'CAFEGO_QUERY_RECT', reqId: id, selector, textMatch, index }, '*');
        setTimeout(() => {
          if (pendingRectQueries.has(id)) {
            pendingRectQueries.delete(id);
            resolve(null);
          }
        }, 700);
      });
    }

    function triggerTap(x, y) {
      cursorEl.classList.add('clicking');
      rippleEl.style.left = x + 'px';
      rippleEl.style.top = y + 'px';
      rippleEl.classList.remove('animate');
      void rippleEl.offsetWidth;
      rippleEl.classList.add('animate');
      setTimeout(() => cursorEl.classList.remove('clicking'), 160);
    }

    async function performCursorAction(step) {
      const frame = step.phone === 'left' ? userFrame : opsFrame;
      setFocus(step.phone);

      if (step.action === 'nav') {
        if (step.phone === 'left') { userFrame.src = step.url; setUserStrip(step.tabIdx); }
        else { opsFrame.src = step.url; setOpsStrip(step.tabIdx); }
        return;
      }

      if (step.action === 'scroll') {
        frame.contentWindow.postMessage({ type: 'CAFEGO_SCROLL', y: step.y || 0 }, '*');
        return;
      }

      const elRect = await queryElementRect(frame, step.selector, step.textMatch, step.index);
      if (!elRect) return;

      const fRect = frame.getBoundingClientRect();
      const scaleX = fRect.width / (frame.offsetWidth || 348);
      const scaleY = fRect.height / (frame.offsetHeight || 680);
      const cx = fRect.left + (elRect.left + elRect.width * 0.5) * scaleX;
      const cy = fRect.top + (elRect.top + elRect.height * 0.5) * scaleY;

      cursorEl.classList.add('visible');
      cursorEl.style.left = cx + 'px';
      cursorEl.style.top = cy + 'px';

      setTimeout(() => {
        if (!isPlaying) return;
        triggerTap(cx, cy);
        if (step.action === 'type') {
          frame.contentWindow.postMessage({ type: 'CAFEGO_TYPE', selector: step.selector, textMatch: step.textMatch, value: step.value }, '*');
        } else if (step.action === 'click') {
          frame.contentWindow.postMessage({ type: 'CAFEGO_EXEC_CLICK', selector: step.selector, textMatch: step.textMatch, index: step.index }, '*');
          if (step.tabIdx !== undefined) {
            if (step.phone === 'left') setUserStrip(step.tabIdx);
            else setOpsStrip(step.tabIdx);
          }
        }
      }, 420);
    }

    // 4. Deterministic Scenes & Steps (0..48s)
    const SCENES = [
      { start: 0, end: 5.5, label: '1 · Onboarding' },
      { start: 5.5, end: 13.0, label: '2 · Customize Drink' },
      { start: 13.0, end: 21.5, label: '3 · Cart & Pay' },
      { start: 21.5, end: 28.0, label: '4 · Kitchen KDS' },
      { start: 28.0, end: 36.5, label: '5 · Driver GPS' },
      { start: 36.5, end: 41.5, label: '6 · Rate & Receipt' },
      { start: 41.5, end: 48.0, label: '7 · Admin Manager' }
    ];

    const STEPS = [
      { id: 's0_init', t: 0.1, phone: 'left', action: 'nav', url: 'mobile_pages/landing.html', tabIdx: 0 },
      { id: 's0_ops', t: 0.2, phone: 'right', action: 'nav', url: 'mobile_pages/staff-kds.html', tabIdx: 0 },
      { id: 's0_splash_tap', t: 2.0, phone: 'left', action: 'click', selector: '.splash-wrap', tabIdx: 1 },
      { id: 's0_login_wait', t: 3.4, phone: 'left', action: 'click', selector: '.auth-cta-btn', textMatch: 'Login', tabIdx: 2 },

      { id: 's1_scroll', t: 5.7, phone: 'left', action: 'scroll', y: 150 },
      { id: 's1_pick', t: 6.7, phone: 'left', action: 'click', selector: '.item-card', textMatch: 'Spanish Latte' },
      { id: 's1_oat', t: 8.3, phone: 'left', action: 'click', selector: '.opt-pill', textMatch: 'Oat' },
      { id: 's1_note', t: 9.7, phone: 'left', action: 'type', selector: '#noteInput', value: 'Extra hot please' },
      { id: 's1_add', t: 11.1, phone: 'left', action: 'click', selector: 'button.brand-btn', textMatch: 'Add to Cart' },

      { id: 's2_cart', t: 13.2, phone: 'left', action: 'click', selector: 'a[href="cart.html"]', tabIdx: 3 },
      { id: 's2_chk', t: 14.9, phone: 'left', action: 'click', selector: 'a[href="checkout.html"]' },
      { id: 's2_scroll', t: 16.4, phone: 'left', action: 'scroll', y: 380 },
      { id: 's2_place', t: 17.6, phone: 'left', action: 'click', selector: '#placeOrderBtn' },
      { id: 's2_auth', t: 19.6, phone: 'left', action: 'click', selector: 'button.brand-btn', textMatch: 'Authorize Payment Now', tabIdx: 4 },

      { id: 's3_prep', t: 22.0, phone: 'right', action: 'click', selector: 'button.brand-btn', textMatch: 'Start Preparing' },
      { id: 's3_ready', t: 25.0, phone: 'right', action: 'click', selector: 'button.brand-btn', textMatch: 'Mark as Ready' },

      { id: 's4_drv_nav', t: 28.1, phone: 'right', action: 'nav', url: 'mobile_pages/driver-workspace.html', tabIdx: 1 },
      { id: 's4_accept', t: 29.5, phone: 'right', action: 'click', selector: 'button.brand-btn', textMatch: 'Accept Delivery' },
      { id: 's4_gps1', t: 31.4, phone: 'right', action: 'click', selector: 'button.ghost-btn', textMatch: 'Advance GPS' },
      { id: 's4_gps2', t: 33.1, phone: 'right', action: 'click', selector: 'button.ghost-btn', textMatch: 'Advance GPS' },
      { id: 's4_done', t: 34.9, phone: 'right', action: 'click', selector: '#completeBtn' },

      { id: 's5_star', t: 37.2, phone: 'left', action: 'click', selector: '.star-btn', index: 4 },
      { id: 's5_submit', t: 38.9, phone: 'left', action: 'click', selector: 'button.brand-btn', textMatch: 'Submit Rating' },

      { id: 's6_adm_nav', t: 41.6, phone: 'right', action: 'nav', url: 'mobile_pages/admin-orders.html', tabIdx: 2 },
      { id: 's6_adm_cat', t: 43.5, phone: 'right', action: 'click', selector: 'a[href="admin-catalog.html"]' },
      { id: 's6_adm_an', t: 45.4, phone: 'right', action: 'click', selector: 'a[href="admin-analytics.html"]' }
    ];

    function resetDemoData() {
      const nextRev = (hostState && hostState._rev ? hostState._rev : 1) + 1;
      hostState = CafeDemo.buildDefaultState();
      hostState._rev = nextRev;
      try { localStorage.setItem('cafego_live_demo_state_v1', JSON.stringify(hostState)); } catch (_) {}
      broadcastState(hostState, null);
    }

    function prepareBaselineAt(t) {
      resetDemoData();
      if (t < 5.5) {
        userFrame.src = t >= 2.3 ? 'mobile_pages/login.html' : 'mobile_pages/landing.html';
        opsFrame.src = 'mobile_pages/staff-kds.html';
        setUserStrip(t >= 2.3 ? 1 : 0);
        setOpsStrip(0);
      } else if (t < 13.0) {
        userFrame.src = 'mobile_pages/menu.html';
        opsFrame.src = 'mobile_pages/staff-kds.html';
        setUserStrip(2); setOpsStrip(0);
      } else if (t < 21.5) {
        userFrame.src = 'mobile_pages/cart.html';
        opsFrame.src = 'mobile_pages/staff-kds.html';
        setUserStrip(3); setOpsStrip(0);
      } else if (t < 28.0) {
        userFrame.src = 'mobile_pages/order-tracking.html';
        opsFrame.src = 'mobile_pages/staff-kds.html';
        setUserStrip(4); setOpsStrip(0);
      } else if (t < 36.5) {
        hostState.orders[0].status = 'ready';
        hostState._rev++;
        broadcastState(hostState, null);
        userFrame.src = 'mobile_pages/order-tracking.html';
        opsFrame.src = 'mobile_pages/driver-workspace.html';
        setUserStrip(4); setOpsStrip(1);
      } else if (t < 41.5) {
        hostState.orders[0].status = 'completed';
        hostState.orders[0].riderProgress = 1.0;
        hostState._rev++;
        broadcastState(hostState, null);
        userFrame.src = 'mobile_pages/order-tracking.html';
        opsFrame.src = 'mobile_pages/driver-workspace.html';
        setUserStrip(4); setOpsStrip(1);
      } else {
        hostState.orders[0].status = 'completed';
        hostState.orders[0].rating = 5;
        hostState._rev++;
        broadcastState(hostState, null);
        userFrame.src = 'mobile_pages/order-receipt.html';
        opsFrame.src = 'mobile_pages/admin-orders.html';
        setUserStrip(4); setOpsStrip(2);
      }
      firedStepIds = new Set(STEPS.filter(s => s.t < t).map(s => s.id));
    }

    function updateHUD() {
      document.getElementById('timeScrubber').value = currentTime;
      const mins = String(Math.floor(currentTime / 60)).padStart(2, '0');
      const secs = String(Math.floor(currentTime % 60)).padStart(2, '0');
      document.getElementById('timeReadout').textContent = `${mins}:${secs} / 00:48`;
      const sc = SCENES.find(s => currentTime >= s.start && currentTime < s.end) || SCENES[SCENES.length - 1];
      document.getElementById('sceneChip').textContent = sc.label;
    }

    function seekTo(seconds) {
      currentTime = Math.min(Math.max(seconds, 0), TOTAL_DURATION);
      prepareBaselineAt(currentTime);
      updateHUD();
    }

    function onScrub(val) {
      seekTo(parseFloat(val));
    }

    function playVideo() {
      if (isPlaying) return;
      isPlaying = true;
      document.getElementById('playBtn').textContent = '⏸ Pause';
      cursorEl.classList.add('visible');
      lastTs = performance.now();
      tickLoop(lastTs);
    }

    function pauseVideo() {
      isPlaying = false;
      document.getElementById('playBtn').textContent = '▶ Play';
      cursorEl.classList.remove('visible');
      setFocus('none');
      if (rafId) cancelAnimationFrame(rafId);
    }

    function togglePlay() {
      if (isPlaying) pauseVideo(); else playVideo();
    }

    function setSpeed(spd, btn) {
      playbackSpeed = spd;
      document.querySelectorAll('.spd-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }

    function resetAndPause() {
      pauseVideo();
      currentTime = 0;
      firedStepIds.clear();
      resetDemoData();
      userFrame.src = 'mobile_pages/menu.html';
      opsFrame.src = 'mobile_pages/admin-orders.html';
      setUserStrip(2); setOpsStrip(2);
      updateHUD();
    }

    function tickLoop(now) {
      if (!isPlaying) return;
      const dt = (now - lastTs) / 1000.0;
      lastTs = now;
      currentTime += dt * playbackSpeed;

      if (currentTime >= TOTAL_DURATION) {
        currentTime = 0.0;
        firedStepIds.clear();
        resetDemoData();
      }

      STEPS.forEach(step => {
        if (!firedStepIds.has(step.id) && currentTime >= step.t) {
          firedStepIds.add(step.id);
          performCursorAction(step);
        }
      });

      updateHUD();
      rafId = requestAnimationFrame(tickLoop);
    }

    window.seekTo = seekTo;
    window.playVideo = playVideo;
    window.pauseVideo = pauseVideo;
    window.hyperframeTimeline = {
      duration: TOTAL_DURATION,
      seek: seekTo,
      play: playVideo,
      pause: pauseVideo,
      getCurrentTime: () => currentTime,
      getTotalDuration: () => TOTAL_DURATION
    };

    window.addEventListener('load', () => {
      resetDemoData();
      updateHUD();
      setTimeout(() => playVideo(), 450);
    });
  </script>
</body>
</html>
